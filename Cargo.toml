[package]
authors = ["Elia Scotto <elia@scotto.me>"]
categories = [
    "command-line-utilities",
    "network-programming",
]
name = "walden"
version = "0.2.1"
edition = "2024"
default-run = "walden"
description = "Blocks distracting websites with an unblock-delay."
license = "GPL-3.0-or-later"
repository = "https://github.com/eliascotto/walden"
homepage = "https://github.com/eliascotto/walden"
readme = "README.md"
rust-version = "1.96"

[profile.release]
# Debian's lintian requires installed ELF executables to be stripped. Keep
# stripping in the release build so packaged binaries match Cargo's output.
strip = "symbols"

[lib]
name = "walden"
path = "src/lib.rs"

[[bin]]
name = "walden"
path = "src/main.rs"

[[bin]]
name = "waldend"
path = "src/bin/waldend.rs"

[dependencies]
dialoguer = "0.12.0"
libc = "0.2"
sha2 = "0.11.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde_json = "1.0.151"
toml = "0.9.8"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }

[dependencies.clap]
version = "4.6.4"
features = ["color", "wrap_help", "derive"]

# Walden reads service definitions and never writes them, so the property-list
# format is needed only to check the one the macOS package installs.
[dev-dependencies]
plist = "1.10.0"

[build-dependencies]
cc = "1"
